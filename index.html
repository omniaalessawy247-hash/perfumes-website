<!doctype html>
<html lang="en">
  <head>
    <script>
      // Never let the browser restore an old scroll position: the hero is scrubbed by scroll,
      // so a restored offset would play the scenes by itself after a refresh.
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
      // A leftover #hash (e.g. /#collection from a nav click) makes a refresh smooth-scroll down
      // through the whole pinned hero and play every scene, so drop it on load.
      if (location.hash) history.replaceState(null, '', location.pathname + location.search)
      window.scrollTo(0, 0)
      window.addEventListener('pagehide', function () { window.scrollTo(0, 0) })
      window.addEventListener('beforeunload', function () { window.scrollTo(0, 0) })
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AMBRE. Four perfumes, each with its own colour, mood and story." />
    <title>AMBRE | Perfume</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300;1,9..144,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
